<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MB3 Deck Box 3D viewer</title>
<style>
@font-face { font-family: "MB3 Goudy"; src: url("fonts/goudy-old-style.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "MB3 Old English"; src: url("fonts/old-english-text.ttf") format("truetype"); font-display: swap; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #e4e7eb; color: #15181d; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
[hidden] { display: none !important; }
.app { display: flex; height: 100%; }
.stage { position: relative; flex: 1; min-width: 0; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; outline-offset: -3px; }
canvas:active { cursor: grabbing; }
canvas:focus-visible { outline: 2px solid #2456e6; }
.hint { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,.8); border-radius: 999px; font-size: 12px; padding: 4px 10px; pointer-events: none; }
.status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 500; padding: 24px; text-align: center; pointer-events: none; }
.bar { position: absolute; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.bar > * { pointer-events: auto; }
.bar.bottom { bottom: 10px; align-items: flex-end; }
.bar.top { top: 10px; justify-content: flex-end; padding-left: 250px; }
.spacer { flex: 1; pointer-events: none; }
.btn { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 8px 14px; background: #2a2f37; color: #f3f5f7; cursor: pointer; }
.btn:hover { background: #3c434e; }
.pill { font: inherit; font-size: 12.5px; font-weight: 500; border: 0; background: rgba(255,255,255,.82); color: #15181d; border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.pill:hover { background: #fff; }
.round { font: inherit; font-size: 18px; line-height: 1; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,.82); color: #15181d; cursor: pointer; }
.round:hover { background: #fff; }
.btn:focus-visible, .pill:focus-visible, .round:focus-visible, .sw:focus-visible, input:focus-visible { outline: 2px solid #2456e6; outline-offset: 2px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; background: rgba(255,255,255,.82); border-radius: 999px; padding: 5px 11px; }
.panel { display: none; width: 290px; flex: none; overflow: auto; background: #fff; border-left: 1px solid #d3d8df; padding: 16px; flex-direction: column; gap: 16px; }
body.controls .panel { display: flex; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field h3 { margin: 0; font-size: 13px; }
.val { color: #5b6470; font-size: 12.5px; }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #c3c9d1; padding: 0; cursor: pointer; position: relative; }
.sw[aria-checked="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #15181d; }
.texts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; font-size: 13px; }
.texts input { font: inherit; width: 100%; min-width: 0; padding: 6px 9px; border: 1px solid #c3c9d1; border-radius: 8px; }
@media (max-width: 720px) {
  .hint { display: none; }
  .bar.top { padding-left: 0; justify-content: flex-start; }
  .btn { padding: 7px 11px; font-size: 13px; }
  .app { flex-direction: column; }
  .panel { width: auto; border-left: 0; border-top: 1px solid #d3d8df; max-height: 45%; }
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="gl" tabindex="0" role="img" aria-label="3D deck box. Drag to rotate. Click the viewer, then scroll to zoom."></canvas>
    <span class="hint">Drag to rotate · click, then scroll to zoom</span>
    <div class="status" id="status">Loading 3D model…</div>
    <div class="bar top" id="views">
      <button class="pill" type="button" data-view="iso">3/4 view</button>

      <button class="pill" type="button" data-view="top">Top</button>
      <button class="pill" type="button" data-view="front">Front latch</button>
      <button class="pill" type="button" data-view="bottom">Bottom</button>
      <button class="pill" type="button" data-view="lidin">Inside lid</button>
      <button class="pill" type="button" data-view="basein">Inside base</button>

    <div class="bar bottom">
      <button class="btn" id="bLid" type="button">Open box</button>
      <button class="btn" id="bTray" type="button">Take tray out</button>
      <button class="btn" id="bNets" type="button">Take nets out</button>

      <button class="round" id="zOut" type="button" aria-label="Zoom out">&minus;</button>
      <button class="round" id="zIn" type="button" aria-label="Zoom in">+</button>

  </div>
  <div class="panel">
    <div class="field">
      <div class="row"><h3 id="boxLabel">Box color</h3><span class="val" id="boxVal"></span></div>
      <div class="swatches" id="boxSw" role="radiogroup" aria-labelledby="boxLabel"></div>

    <div class="field">
      <div class="row"><h3 id="accLabel">Accent color</h3><span class="val" id="accVal"></span></div>
      <div class="swatches" id="accSw" role="radiogroup" aria-labelledby="accLabel"></div>

    <div class="field">
      <h3>Custom text</h3>
      <div class="texts">
        <label for="tTop">Top</label><input id="tTop" type="text" maxlength="25" autocomplete="off">
        <label for="tLatch">Latch exterior</label><input id="tLatch" type="text" maxlength="25" autocomplete="off">
        <label for="tLatchBack">Latch interior</label><input id="tLatchBack" type="text" maxlength="30" autocomplete="off">
        <label for="tBottom">Bottom</label><input id="tBottom" type="text" maxlength="30" autocomplete="off">
      </div>
    </div>
  </div>
</div>
